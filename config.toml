# ===== CONFIGURACIÓN (reinicia la app tras cambiarla) =====
[model]
path = "assets/bobber.glb" # Bobber del club con clips reposo/saludar/caminar (lo genera tools/animar_bobber.py)
heading_degrees = -90      # -90 = mira al público con bobber.glb. Con el modelo de pruebas mascota.gltf, 180

[animations]               # nombres de los clips tal y como están en Blender
reposo = ["reposo", "idle"]
saludo = ["saludo", "saludar", "jump", "waving"]
caminar = ["caminar", "walk", "walking"]

[camera]
index = 0                  # 0 = primera cámara; prueba 1, 2... si hay varias
width = 640
height = 480
starting_timeout_seconds = 10.0  # pasar a manual si el driver no responde
retry_seconds = 30.0       # tras un fallo de cámara, reintentar cada X s (0 = no reintentar)

[detection]
auto_start = true          # false = arrancar en modo manual
interval_ms = 150          # cada cuánto se analiza un fotograma
min_visibility = 0.5       # confianza mínima de nariz y hombros (0-1)
min_shoulder_width = 0.10  # anchura mínima de hombros (0-1). Súbelo para ignorar a quien pasa lejos
pose_model = "assets/pose_landmarker_lite.task"   # se descarga solo la primera vez

[timing]
detect_seconds = 0.8       # presencia estable antes de saludar
reset_seconds = 4.0        # sin nadie este tiempo -> reposo y permite saludar de nuevo
greeting_cooldown_seconds = 8.0  # respaldo temporal; una ausencia confirmada rearma el saludo
lost_tolerance_seconds = 0.5     # tras este tiempo sin detección se rearma; filtra pérdidas más breves

[gestures]                 # reconocimiento de gestos de mano (MediaPipe Gesture Recognizer)
enabled = true             # false = solo detección de personas
model = "assets/gesture_recognizer.task"
min_confidence = 0.6       # confianza mínima del detector (0-1)
confirm_seconds = 0.6      # el gesto debe mantenerse estable antes de actuar
cooldown_seconds = 3.0     # espera mínima entre acciones por gesto
release_seconds = 0.7      # tiempo sin gesto para rearmar la misma acción
walk_seconds = 4.0         # duración de caminar antes de volver a reposo

[gestures.actions]         # acción asignada a cada gesto reconocido
palma_abierta = "saludo"
puno_cerrado = "caminar"
dedo_arriba = "ninguna"
pulgar_arriba = "ninguna"
pulgar_abajo = "ninguna"
victoria = "ninguna"
te_quiero = "ninguna"

[stats]                    # contador anónimo del stand: solo números por hora, sin imágenes ni personas
enabled = true
path = "estadisticas/bobber.csv"   # CSV local para Excel (separado por ;). No se sube a Git
save_every_seconds = 60.0  # además se guarda al cerrar la app

[attract]                 # modo reclamo: llamar la atención (solo en modo automático)
empty_seconds = 15.0       # nadie delante este tiempo -> una acción (0 = desactivado)
idle_seconds = 45.0        # nadie interactúa (gesto o tecla) este tiempo, aunque pase gente -> una acción (0 = desactivado)
actions = ["saludo", "caminar"]   # se alternan; "caminar" solo si el modelo tiene ese clip

[window]
fullscreen = true          # ventana sin bordes a pantalla completa (F11 la alterna)
hide_controls = true       # en pantalla completa oculta botones, cursor y estado al público; C o F11 los muestran
keep_awake = true          # mientras la app está abierta, Windows no se suspende ni apaga la pantalla
icon = "assets/bobber.ico" # icono de la ventana y la barra de tareas (logo del Maker Club León)
font = ""                  # opcional: ruta a un .ttf. Vacío = Segoe UI/Arial de Windows

[render]
toon = true                # pintar como Blender (Material Preview) con las tablas de color de bobber.json
toon_ambient = 0.3         # luz mínima de las piezas «toon»: las que no miran a la luz quedan en su tono oscuro
toon_gain = 1.0            # luz extra cuanto más mira la pieza hacia la luz (los bordes oscuros salen de ambos)
ink = false                # contorno negro (experimental: con este modelo ensucia tirantes y casco)
ink_thickness = 1.5        # grosor del contorno en píxeles para una pantalla de 1080 de alto (se escala)
light_heading = 10.0       # dirección de la luz respecto a la cámara: 0 = de frente, positivo = desde la derecha
light_pitch = -35.0        # inclinación de la luz: negativo = desde arriba (sombra bajo mofletes y barbilla, como Blender)
ambient = 0.9              # luz ambiente de las piezas sin tabla (y de todo con toon = false)
directional = 0.4          # luz directa de las piezas sin tabla (y de todo con toon = false)

[background]               # fondo detrás de Bobber
image = "assets/fondo.png"                 # opcional: imagen (.png/.jpg) a pantalla completa; se recorta sin deformarse. Vacío = degradado
top = "#7fc4e8"            # color de arriba del degradado (cielo)
bottom = "#2f7a4f"         # color de abajo (césped)
glow = "#e9f7ff"           # halo suave detrás de Bobber
glow_strength = 0.5        # intensidad del halo (0 = sin halo)

[messages]
idle = "Acércate para saludar"
hello = "¡Hola!"
after = "¡Disfruta de la feria!"
manual = "Modo manual"
walk = "¡Vamos a dar un paseo!"    # mientras camina (puño cerrado o tecla 3)
# Ayuda de gestos (modo automático con gestos activos). Si cambias [gestures.actions],
# cambia también este texto. Vacío ("") = no mostrarla.
hint = "Saluda con la mano abierta  ·  Cierra el puño para que camine"
hold = "¡Mantén el gesto!"         # mientras se confirma un gesto. Vacío = no mostrarlo
attract = "¡Ven a saludarme!"      # durante el modo reclamo. Vacío = mensaje normal de la acción
